name: Lint

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: black
        run: uv run --frozen black --check --diff .

      - name: flake8
        run: uv run --frozen flake8 .
