name: CI

on:
  push:
    branches: [dev, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DJANGO_SECRET_KEY: django-insecure-book-plan-ci-key
  DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  POSTGRES_DB: book_plan
  POSTGRES_USER: book_plan
  POSTGRES_PASSWORD: book_plan_ci
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting with Black
        run: uv run --locked black --check --diff .

      - name: Lint with Flake8
        run: uv run --locked flake8 --count .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: book_plan
          POSTGRES_USER: book_plan
          POSTGRES_PASSWORD: book_plan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U book_plan -d book_plan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Django system checks
        run: uv run --locked python manage.py check

      - name: Check for missing migrations
        run: uv run --locked python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run --locked pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    # the image is published only when it is going to be deployed, PRs just build it
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/book-plan-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          target: prod
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: [self-hosted, book-plan-prod]
    timeout-minutes: 10
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: http://37.233.80.237:8090
    steps:
      - name: Check out compose file
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docker-compose.prod.yml
          sparse-checkout-cone-mode: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # /opt/book-plan/.env with production secrets lives only on the server;
      # the deployed IMAGE_TAG is saved there so manual docker compose calls use it too
      - name: Deploy
        env:
          DEPLOY_DIR: /opt/book-plan
        run: |
          export IMAGE_TAG="sha-${GITHUB_SHA::7}"
          install -m 644 docker-compose.prod.yml "$DEPLOY_DIR/docker-compose.yml"
          cd "$DEPLOY_DIR"
          docker compose pull backend
          docker compose up -d --wait db
          docker compose run --rm -T backend python manage.py migrate --noinput
          docker compose up -d --wait --remove-orphans
          sed -i '/^IMAGE_TAG=/d' .env
          echo "IMAGE_TAG=$IMAGE_TAG" >> .env

      - name: Smoke test
        working-directory: /opt/book-plan
        run: |
          port="$(docker compose port backend 8000 | cut -d: -f2)"
          url="http://localhost:$port/admin/login/"
          for _ in $(seq 10); do curl -fsS -o /dev/null "$url" && exit 0; sleep 3; done
          echo "::error::$url is not responding"
          exit 1

      - name: Remove old images
        if: always()
        run: >-
          docker image prune -af
          --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}"
