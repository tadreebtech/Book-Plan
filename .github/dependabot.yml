version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # pyproject.toml pins requires-python to 3.13
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
