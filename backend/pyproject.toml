[project]
name = "book-plan-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.16",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "black>=26.10.0",
    "django-stubs>=6.1.2,<6.2",
    "flake8>=7.4.1",
    "pytest>=8",
    "pytest-django>=4.9",
]

[tool.black]
line-length = 100
extend-exclude = "/migrations/"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.django.base"
filterwarnings = ["ignore:No directory at:UserWarning"]
