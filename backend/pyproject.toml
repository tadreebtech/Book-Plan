[project]
name = "book-plan-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.16",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "django-stubs>=5.2,<5.3",
    "flake8>=7.5.0",
    "pytest>=9.2.0",
    "pytest-django>=4.9",
]

[tool.black]
line-length = 100
extend-exclude = "/migrations/"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.django.base"
filterwarnings = ["ignore:No directory at:UserWarning"]
