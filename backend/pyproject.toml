[project]
name = "book-plan-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.16",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "black>=26.10.0",
    "django-stubs>=5.2,<5.3",
    "flake8>=7.4.1",
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.6",
]

[tool.black]
line-length = 100
extend-exclude = "/migrations/"

[tool.ruff]
line-length = 100
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.django.base"
